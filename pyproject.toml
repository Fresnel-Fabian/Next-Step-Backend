[project]
name = "next-step-backend"
version = "0.1.0"
description = "A Time management and scheduling app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.2",
    "fastapi>=0.128.0",
    "flower>=2.0.1",
    "google-auth>=2.47.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.21",
    "redis>=6.4.0",
    "requests>=2.32.5",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn[standard]>=0.40.0",
    "black>=26.1.0",
    "aiosqlite>=0.22.1",
    "sentry-sdk[fastapi]>=2.18.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line too long (formatter handles this)
    "B008",  # function call in argument defaults — FastAPI uses `Depends(...)` everywhere
    "E712",  # comparison to True/False — SQLAlchemy requires `Column == False` for WHERE clauses
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy models use quoted forward refs like `Mapped["User"]` for relationships.
# Ruff can't see the string as a type reference; treat F821 as expected here.
"app/models/*.py" = ["F821"]

[tool.black]
line-length = 100
target-version = ["py312"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.0",
]
